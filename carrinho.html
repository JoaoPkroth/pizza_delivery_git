<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho | Pizza Express</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #111111;
            color: #ffffff;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background-color: #202020;
            padding: 35px;
            border-radius: 12px;
        }
        h1 {
            color: #ffc400;
            text-align: center;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        .total {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            color: #ffc400;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #b30000;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ffc400;
            color: #111111;
        }
        a {
            color: #ffc400;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Seu Carrinho</h1>

    <div class="item">
        <span>Pizza Clássica</span>
        <span>R$ 49,90</span>
    </div>

    <div class="item">
        <span>Pizza Especial</span>
        <span>R$ 59,90</span>
    </div>

    <div class="total">Total: R$ 109,80</div>

    <button onclick="alert('Pedido finalizado com sucesso!')">
        Finalizar Pedido
    </button>

    <p>
        <a href="index.html">Voltar para o delivery</a>
    </p>
</div>

</body>
</html>
